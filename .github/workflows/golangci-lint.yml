name: golangci-lint

on:
  push:
  pull_request:

jobs:
  golangci:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
